[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "table-remodeler"
version = "0.3.0"
description = "Tabular file remodeling and reorganizing tools for event files and datasets."
readme = "README.md"
authors = [
    { name = "Monique Denissen", email = "moniquedenissen.95@gmail.com" },
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
maintainers = [
    { name = "Monique Dennisen", email = "moniquedenissen.95@gmail.com" },
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
license = {text = "MIT"}
keywords = ["remodeling", "tabular data", "event files", "neuroscience", "BIDS", "HED", "data transformation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.10"

dependencies = [
    "hedtools>=1.2.0",
    "jsonschema>=4.23.0",
    "pandas>=2.2.3,<4.0.0",
]

[project.urls]
"Homepage" = "https://www.hedtags.org/"
"Documentation" = "https://www.hedtags.org/table-remodeler/"
"Repository" = "https://github.com/hed-standard/table-remodeler"
"Bug Tracker" = "https://github.com/hed-standard/table-remodeler/issues"
"Changelog" = "https://github.com/hed-standard/table-remodeler/blob/main/CHANGELOG.md"
"HED Resources" = "https://www.hedtags.org/hed-resources"


[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "typos>=1.29.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]
docs = [
    "sphinx>=7.1.0,<10.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0,<3.12.1",
    "linkify-it-py>=2.0.3",
]
test = [
    "coverage>=7.0.0",
]

examples = [
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "nbformat>=5.9.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.25.0",
]

[project.scripts]
run_remodel = "remodeler.cli.run_remodel:main"
run_remodel_backup = "remodeler.cli.run_remodel_backup:main"
run_remodel_restore = "remodeler.cli.run_remodel_restore:main"

[tool.setuptools.packages.find]
where = [""]
include = ["remodeler*"]
namespaces = false

[tool.typos.files]
extend-exclude = ["*.pdf", "*.svg", "venv*", "*.tsv", "*.yaml", "*.yml", "*.json", "*.rdf", "*.jsonld", "*.xml", "*.mediawiki", "*.omn", "*.toml"]

[tool.typos.default.extend-words]
te = "te"
parms = "parms"
assertIn = "assertIn"
HED = "HED"
hed = "hed"
Hed = "Hed"
succesful = "succesful"
unsuccesful = "unsuccesful"

[tool.ruff]
# Target Python 3.10+
target-version = "py310"
line-length = 120

# Exclude common directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".status",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["remodeler"]

[tool.ruff.format]
# Ruff format configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
